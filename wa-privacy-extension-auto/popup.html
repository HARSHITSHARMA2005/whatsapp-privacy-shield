<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 250px; padding: 16px; font-family: sans-serif; background: #111b21; color: white; }
    button { width: 100%; padding: 10px; margin: 4px 0; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
    #btnOn  { background: #00a884; color: white; }
    #btnOff { background: #444; color: white; }
    #btnAuto { background: #2a3942; color: white; }
    #status { margin-top: 10px; font-size: 12px; color: #8696a0; text-align: center; }
  </style>
</head>
<body>
  <button id="btnOn">🔒 Always On (Blur)</button>
  <button id="btnAuto">🤖 Auto (Screen share only)</button>
  <button id="btnOff">👁️ Always Off</button>
  <div id="status">Loading...</div>
  <script src="popup.js"></script>
</body>
</html>
